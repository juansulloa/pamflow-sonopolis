# General parameters
audio_root_directory: /Volumes/Extreme SSD/25-203_SONOPOLIS/PERIODO-B
timezone: "America/Bogota"

# Parameters for generating timelapses
timelapse:
  sample_length: 1        # Length of each sample for timelapse (in seconds)
  sample_period: '30min'  # Time interval between samples (e.g., '30min')
  sample_date: 2026-08-15 # Specific date for timelapse (YYYY-MM-DD). If null, the date with the most data will be used.

  # Parameters used in species_detection pipeline
species_detection_parameters:
  n_jobs: -1 #Number of cores used in parallelization: -1 forces to use all the cores available.
  use_location_filter: false #If false, lat/lon are not passed to BirdNET and detections are not filtered by location
  min_conf: 0.1 #Minimum BirdNET confidence for a detection to be kept
  minimum_observations: 20 #Minimum number of detections for a species to be considered  in the observations format
  segment_size: 50 #Number of sample segments per species,
  manual_annotations_file_name: 'species_manual_annotations' #prefix in file name for manual annotations:  {manual_annotations_file_name}_{species}
  classifier_model_path: /Users/jsulloa/github/pamflow-sonopolis/data/input/custom_model_v20261101/Custom_Classifier.tflite #Path to a custom BirdNET-derived classifier model file, null for the default BirdNET model
  classifier_labels_path: /Users/jsulloa/github/pamflow-sonopolis/data/input/custom_model_v20261101/Custom_Classifier_Labels.txt #Path to the custom classifier labels file (one 'Genus species_common name' per line), null for the default BirdNET model
  segment_sampling_method: stratified #How segments are sampled per species: 'random' (uniform) or 'stratified' (equal draws per classification probability bin)
  segment_n_bins: 10 #Number of equal-width probability bins, used only when segment_sampling_method is 'stratified'
  segment_seed: 123 #Integer seed to reproduce the segment sample, null for a different sample each run

detection_validation_parameters:
  true_positive_rate: 0.9 #True positive rate (precision) a species cutoff must reach. Between 0 and 1 (exclusive). Output column names follow it (0.9 -> cutoffConfidence90, sweepCutoff90)
  min_sample_size: 20 #Minimum validated segments to trust a model cutoff, and minimum segments at or above a candidate threshold to trust a sweep cutoff
  threshold_method: auto #Source of appliedCutoff: 'sweep', 'model' or 'auto' (sweep first, then model)
  plot_thresholds: false #If true, save a confidence score plot per fitted species
  keep_unthresholded: false #If true, keep unfiltered observations of species with no cutoff (no validated segments). Default drops them
  apply_confusions: false #If true, relabel observations of species consistently confused with another one (species_confusions) and tag them 'inferred_reassignment'
  fallback_classified_by: null #classifiedBy for human-reviewed rows whose annotator is empty. null leaves it blank
  classification_timestamp: '2026-11-04T00:00:00' #ISO 8601 timestamp for human-reviewed rows, e.g. '2026-11-04T00:00:00'. null uses the run time
